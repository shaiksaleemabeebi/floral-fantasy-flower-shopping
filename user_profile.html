<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Floral Fantasy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd8e4, #ff9ec0);
            min-height: 100vh;
            padding: 40px 20px;
            color: #3b2a2f;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        a.back { color: rgba(59,42,47,0.7); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 14px; }
        a.back:hover { color: #ff4081; }

        .profile-container {
            background: white;
            padding: 34px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 { font-family: 'Playfair Display', serif; margin: 4px 0 20px; }

        .profile-pic-wrap { position: relative; width: 120px; margin: 0 auto; }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff6b81;
        }
        .upload-btn {
            margin-top: 12px;
            font-size: 13px;
            padding: 9px 16px;
            border: none;
            background-color: #ff6b81;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            font-weight: 600;
            transition: 0.2s ease;
        }
        .upload-btn:hover { background-color: #e63946; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
        .form-group { text-align: left; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #f0c9d6;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fffafb;
        }
        input:focus, select:focus { outline: none; border-color: #ff6b81; box-shadow: 0 0 0 3px rgba(255,107,129,0.15); }

        .save-btn {
            background-color: #ff6b81;
            color: white;
            padding: 13px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 22px;
            transition: 0.2s ease;
        }
        .save-btn:hover { background-color: #e63946; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="home.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="profile-container">
            <h2>My Profile</h2>

            <div class="profile-pic-wrap">
                <img src="https://i.pravatar.cc/150?img=47" alt="Profile Picture" class="profile-pic" id="profileImage">
            </div>
            <input type="file" id="upload" style="display: none;" accept="image/*" onchange="previewImage(event)">
            <button class="upload-btn" onclick="document.getElementById('upload').click()">Upload Photo</button>

            <form id="profileForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>
                    <div class="form-group full">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="Street, City, State, ZIP" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="City">
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender">
                            <option value="">Prefer not to say</option>
                            <option value="female">Female</option>
                            <option value="male">Male</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="save-btn" onclick="saveProfile()">Save Profile</button>
            </form>
        </div>
    </div>

    <script>
        // Pre-fill from registered user if available
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (currentUser) {
            document.getElementById("name").value = currentUser.name || "";
            document.getElementById("email").value = currentUser.email || "";
            document.getElementById("phone").value = currentUser.phone || "";
            document.getElementById("address").value = currentUser.address || "";
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                document.getElementById('profileImage').src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function saveProfile() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const dob = document.getElementById('dob').value;
            const city = document.getElementById('city').value;
            const gender = document.getElementById('gender').value;

            if (!name || !email || !phone || !address) {
                alert("Please fill in all required fields.");
                return;
            }

            const profile = { name, email, phone, address, dob, city, gender };
            localStorage.setItem("currentUser", JSON.stringify(profile));

            alert("Profile Saved Successfully!");
        }
    </script>
</body>
</html>
